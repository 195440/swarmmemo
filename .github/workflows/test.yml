name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  # The race detector makes the pure-Go SQLite some thirty times slower, so
  # this job runs with -short: the large-fixture tests (every operation's
  # authority matrix, floods of tens of thousands of rows, scale timings)
  # skip here and run in full, with their unscaled time bounds, in "test".
  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race -short -timeout 30m ./...
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: true
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          enable-cache: true
      - run: go test -timeout 20m ./...
      - run: go vet ./...
      - run: go build -trimpath -o /tmp/swarmmemo-test ./cmd/swarmmemo
      - run: python3 -B -W error::ResourceWarning -m unittest discover -s curation -p 'test_*.py' -v
        env:
          SWARMMEMO_TEST_BINARY: /tmp/swarmmemo-test
      - run: |
          node -e 'if (Number(process.versions.node.split(".")[0]) < 22) throw Error("Node 22+ required")'
          node --test clients/javascript/test_client.mjs deploy/cloudflare-email/worker.test.mjs
          node --experimental-strip-types --test workers/runs-loader/test/loader.test.mjs
          npm ci --ignore-scripts --no-audit --no-fund --prefix workers/corroborate
          node --test workers/corroborate/test/sidecar.test.mjs
        env:
          SWARMMEMO_TEST_BINARY: /tmp/swarmmemo-test
          SWARMMEMO_DELEGATION_TEST_BINARY: /tmp/swarmmemo-test
      - run: uv run --project scripts --locked python -m unittest discover -s scripts -p 'test_*.py' -v
        env:
          SWARMMEMO_TEST_BINARY: /tmp/swarmmemo-test
          SWARMMEMO_DELEGATION_TEST_BINARY: /tmp/swarmmemo-test
          SWARMMEMO_PRIVATE_INBOX_TEST_BINARY: /tmp/swarmmemo-test
          SWARMMEMO_PRIVATE_READ_TEST_BINARY: /tmp/swarmmemo-test
      - run: python3 -B -W error::ResourceWarning -m unittest discover -s scripts/trust -p 'test_*.py' -v
      - run: uv run --project scripts --locked python -B -W error::ResourceWarning -m unittest discover -s clients/python -p 'test_*.py' -v
        env:
          SWARMMEMO_TEST_BINARY: /tmp/swarmmemo-test
      - run: uv run --project clients/mcp --locked python -B -W error::ResourceWarning -m unittest discover -s clients/mcp -p 'test_*.py' -v
        env:
          SWARMMEMO_MCP_TEST_BINARY: /tmp/swarmmemo-test
      - run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -o /tmp/swarmmemo-arm64 ./cmd/swarmmemo
  # The browser suites (internal/web/*.cjs) in headless Chromium, through the
  # same runner the operator's gate uses, with the gate's Playwright
  # (scripts/playwright-version).
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: true
      - run: go build -trimpath -o "$RUNNER_TEMP/swarmmemo" ./cmd/swarmmemo
      - run: |
          node -e 'if (Number(process.versions.node.split(".")[0]) < 22) throw Error("Node 22+ required")'
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --ignore-scripts --no-audit --no-fund "playwright@$(cat scripts/playwright-version)"
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - run: bash scripts/browser-suites.sh
        env:
          SWARMMEMO_TEST_BINARY: ${{ runner.temp }}/swarmmemo
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/pw/node_modules/playwright
          BROWSER_SUITES_DIR: ${{ runner.temp }}/browser
